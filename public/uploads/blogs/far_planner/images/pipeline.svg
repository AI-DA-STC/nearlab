<svg xmlns="http://www.w3.org/2000/svg" width="640" height="716" viewBox="0 0 640 716" role="img"><rect width="640" height="716" fill="#fefefe"/><rect x="16" y="16" width="608" height="66" rx="3" fill="#f2f6fa" stroke="#8fadc8" stroke-width="1"/><text x="28" y="40" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#12212f">Gazebo Sim: M20 model</text><text x="28" y="58" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">100 Hz IMU, front LiDAR with 16 beams × 512 samples over 180° at 10 Hz,</text><text x="28" y="73" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">and 16 torque-controlled joints. The torques from the last stage close the loop.</text><text x="16" y="102" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" letter-spacing="1" fill="#7e7f7b">SENSE AND LOCALISE</text><text x="340" y="102" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" letter-spacing="1" fill="#7e7f7b">PLAN AND DRIVE</text><rect x="16" y="116" width="284" height="74" rx="3" fill="#1a3e62" stroke="#1a3e62" stroke-width="1"/><text x="28" y="139" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#fefefe">pointcloud_lio_adapter.py</text><text x="28" y="158" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#dce6ef">adds the time and ring fields Point-LIO needs</text><text x="28" y="177" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#8fadc8">/M20/LIDAR/FRONT → /M20/LIDAR/FRONT_LIO</text><rect x="16" y="218" width="284" height="74" rx="3" fill="#dce6ef" stroke="#8fadc8" stroke-width="1"/><text x="28" y="241" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#12212f">Point-LIO (M20 config)</text><text x="28" y="260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">LiDAR-inertial odometry and registered scan</text><text x="28" y="279" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#575755">→ /aft_mapped_to_init, /cloud_registered</text><rect x="16" y="320" width="284" height="74" rx="3" fill="#1a3e62" stroke="#1a3e62" stroke-width="1"/><text x="28" y="343" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#fefefe">lio_to_cmu_bridge.py</text><text x="28" y="362" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#dce6ef">renames frames, removes the robot's body</text><text x="28" y="381" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#8fadc8">→ /state_estimation, /registered_scan</text><line x1="158" y1="82" x2="158" y2="111" stroke="#1a3e62" stroke-width="1.5"/><path d="M153.5 110 L158 116 L162.5 110 Z" fill="#1a3e62"/><line x1="158" y1="190" x2="158" y2="213" stroke="#1a3e62" stroke-width="1.5"/><path d="M153.5 212 L158 218 L162.5 212 Z" fill="#1a3e62"/><line x1="158" y1="292" x2="158" y2="315" stroke="#1a3e62" stroke-width="1.5"/><path d="M153.5 314 L158 320 L162.5 314 Z" fill="#1a3e62"/><rect x="340" y="116" width="284" height="74" rx="3" fill="#dce6ef" stroke="#8fadc8" stroke-width="1"/><text x="352" y="139" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#12212f">terrainAnalysis, terrainAnalysisExt</text><text x="352" y="158" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">local and extended terrain maps</text><text x="352" y="177" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#575755">→ /terrain_map, /terrain_map_ext</text><rect x="340" y="218" width="284" height="74" rx="3" fill="#dce6ef" stroke="#8fadc8" stroke-width="1"/><text x="352" y="241" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#12212f">far_planner</text><text x="352" y="260" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">visibility graph and route to the goal</text><text x="352" y="279" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#575755">/goal_point → /way_point</text><rect x="340" y="320" width="284" height="74" rx="3" fill="#dce6ef" stroke="#8fadc8" stroke-width="1"/><text x="352" y="343" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#12212f">localPlanner, pathFollower</text><text x="352" y="362" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">collision-free path to the waypoint</text><text x="352" y="381" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#575755">→ /cmd_vel (TwistStamped, m/s and rad/s)</text><rect x="340" y="422" width="284" height="74" rx="3" fill="#1a3e62" stroke="#1a3e62" stroke-width="1"/><text x="352" y="445" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#fefefe">cmd_vel_to_raw_relay.py</text><text x="352" y="464" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#dce6ef">rescales and clamps the velocity</text><text x="352" y="483" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#8fadc8">→ /cmd_vel_raw (Twist)</text><rect x="340" y="524" width="284" height="74" rx="3" fill="#1a3e62" stroke="#1a3e62" stroke-width="1"/><text x="352" y="547" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#fefefe">rl_deploy --autonomy</text><text x="352" y="566" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#dce6ef">new command interface, unmodified policy.onnx</text><text x="352" y="585" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#8fadc8">→ /M20/JOINTS_CMD</text><rect x="340" y="626" width="284" height="74" rx="3" fill="#1a3e62" stroke="#1a3e62" stroke-width="1"/><text x="352" y="649" font-family="IBM Plex Mono, ui-monospace, monospace" font-weight="500" font-size="12" fill="#fefefe">gazebo_controller_ros2.py</text><text x="352" y="668" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#dce6ef">joint PD law with motor torque limits</text><text x="352" y="687" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" fill="#8fadc8">→ joint torques into Gazebo</text><line x1="482" y1="190" x2="482" y2="213" stroke="#1a3e62" stroke-width="1.5"/><path d="M477.5 212 L482 218 L486.5 212 Z" fill="#1a3e62"/><line x1="482" y1="292" x2="482" y2="315" stroke="#1a3e62" stroke-width="1.5"/><path d="M477.5 314 L482 320 L486.5 314 Z" fill="#1a3e62"/><line x1="482" y1="394" x2="482" y2="417" stroke="#1a3e62" stroke-width="1.5"/><path d="M477.5 416 L482 422 L486.5 416 Z" fill="#1a3e62"/><line x1="482" y1="496" x2="482" y2="519" stroke="#1a3e62" stroke-width="1.5"/><path d="M477.5 518 L482 524 L486.5 518 Z" fill="#1a3e62"/><line x1="482" y1="598" x2="482" y2="621" stroke="#1a3e62" stroke-width="1.5"/><path d="M477.5 620 L482 626 L486.5 620 Z" fill="#1a3e62"/><path d="M300 357 L320 357 L320 153 L334 153" fill="none" stroke="#1a3e62" stroke-width="1.5"/><path d="M333 148.5 L340 153 L333 157.5 Z" fill="#1a3e62"/><path d="M624 663 L632 663 L632 49 L629 49" fill="none" stroke="#8fadc8" stroke-width="1.5" stroke-dasharray="4 3"/><path d="M630 44.5 L624 49 L630 53.5 Z" fill="#8fadc8"/><text x="16" y="432" font-family="IBM Plex Mono, ui-monospace, monospace" font-size="10" letter-spacing="1" fill="#7e7f7b">KEY</text><rect x="16" y="446" width="26" height="16" rx="2" fill="#1a3e62" stroke="#1a3e62" stroke-width="1"/><text x="54" y="458.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">written for this integration</text><rect x="16" y="472" width="26" height="16" rx="2" fill="#dce6ef" stroke="#8fadc8" stroke-width="1"/><text x="54" y="484.5" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="12" fill="#3d3e3c">reused, settings changed</text></svg>
