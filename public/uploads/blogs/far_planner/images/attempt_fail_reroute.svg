IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#3d3e3c">through it are deleted and the</text><text x="223.0" y="294.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#3d3e3c">old route is no longer valid.</text><text x="430.0" y="30" font-family="Archivo, Helvetica Neue, Arial, sans-serif" font-weight="600" font-size="14" fill="#12212f">3  Reroute</text><rect x="430.0" y="52.0" width="194.0" height="194.0" fill="url(#hatch)" stroke="#e4e4e0"/><g clip-path="url(#clip2)"><circle cx="551.6" cy="139.1" r="93.1" fill="#fefefe" stroke="#8fadc8" stroke-width="1" stroke-dasharray="2 3"/></g><text x="430.0" y="264.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#3d3e3c">The graph is searched again</text><text x="430.0" y="279.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#3d3e3c">and the path bends around the</text><text x="430.0" y="294.0" font-family="IBM Plex Sans, system-ui, sans-serif" font-size="11.5" fill="#3d3e3c">end of the wall.</text><line x1="52.9" y1="216.9" x2="122.7" y2="224.7" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="80.0" y1="216.9" x2="122.7" y2="193.6" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="33.5" y1="230.5" x2="80.0" y2="216.9" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="190.6" y1="67.5" x2="80.0" y2="216.9" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="80.0" y1="164.5" x2="122.7" y2="224.7" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="149.9" y1="193.6" x2="80.0" y2="164.5" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="52.9" y1="164.5" x2="33.5" y2="230.5" stroke="#8fadc8" stroke-width="0.9" opacity="0.75" stroke-linecap="round"/><line x1="52.9" y1="164.5" x2="190.6" y2="67.5" stroke="#8fadc8" stroke-width="0.9" 